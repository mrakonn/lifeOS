<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeOS — Database Test</title>
  <style>
    body {
      background: #09090b;
      color: white;
      font-family: sans-serif;
      padding: 30px;
    }

    h1 { color: #a78bfa; }

    #status {
      margin-top: 25px;
      padding: 20px;
      background: #18181b;
      border-radius: 12px;
      line-height: 2;
    }
  </style>
</head>
<body>

<h1>LifeOS Database Test</h1>

<div id="status">Проверка...</div>

<script src="./db.js"></script>

<script>
async function testDatabase() {
  const status = document.getElementById("status");

  try {
    await LifeOSDB.init();

    await LifeOSDB.save("settings", {
      id: "test",
      name: "LifeOS",
      test: true
    });

    const result = await LifeOSDB.get("settings", "test");

    if (result && result.test === true) {
      status.innerHTML =
        "DATABASE: ONLINE<br>" +
        "SAVE: SUCCESS<br>" +
        "READ: SUCCESS<br>" +
        "STATUS: ALL SYSTEMS OPERATIONAL";
    } else {
      throw new Error("Data verification failed");
    }

  } catch (error) {
    status.innerHTML =
      "DATABASE: ERROR<br>" + error.message;
  }
}

testDatabase();
</script>

</body>
</html>
